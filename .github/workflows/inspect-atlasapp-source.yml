name: Inspect original Atlasapp source

on:
  workflow_dispatch:
  push:
    paths:
      - '.github/workflows/inspect-atlasapp-source.yml'

permissions:
  contents: read

jobs:
  inspect:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Extract original Atlasapp packages
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p inspection/v02-source inspection/cloud-build
          unzip -q ATLAS_Futurica_v0.2_Source.zip -d inspection/v02-source
          unzip -q 'ATLAS_Futurica_Android_Cloud_Build_Package-1 (1).zip' -d inspection/cloud-build
          find inspection -type f -printf '%p\t%s bytes\n' | sort > inspection/FILE_INVENTORY.txt
          echo '--- feature files ---'
          grep -Ei 'rss|feed|book|pdf|reader|tts|magazine|library|setting|service.worker|manifest|readme' inspection/FILE_INVENTORY.txt || true
          echo '--- html/js/css entry points ---'
          find inspection -type f \( -name '*.html' -o -name '*.js' -o -name '*.css' -o -name 'package.json' -o -name 'manifest.json' -o -name 'manifest.webmanifest' \) -print

      - name: Upload expanded original source
        uses: actions/upload-artifact@v4
        with:
          name: Atlasapp-Original-Source-Inspection
          path: inspection/
          if-no-files-found: error
          retention-days: 7

name: Build ATLAS Android APK

'on':
  workflow_dispatch:
  push:
    paths:
      - '*.zip'
      - '.github/workflows/build-atlas-apk.yml'

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Install Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Extract Android project
        run: |
          set -eu
          ZIP_FILE="$(find . -maxdepth 1 -type f -iname '*Cloud*Build*Package*.zip' -print -quit)"
          test -n "$ZIP_FILE"
          mkdir extracted
          unzip -q "$ZIP_FILE" -d extracted
          PROJECT_DIR="$(find extracted -type f -name settings.gradle -printf '%h\n' -quit)"
          test -n "$PROJECT_DIR"
          echo "PROJECT_DIR=$PROJECT_DIR" >> "$GITHUB_ENV"

      - name: Build debug APK
        run: |
          cd "$PROJECT_DIR"
          gradle assembleDebug --stacktrace

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: ATLAS-Futurica-debug-APK
          path: extracted/**/build/outputs/apk/debug/*.apk
          if-no-files-found: error
          retention-days: 14
